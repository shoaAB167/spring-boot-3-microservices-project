spring.application.name=notification-service
server.port=8083

# Local secrets and overrides: KEY=VALUE lines from a git-ignored .env file (see .env.example).
# Both paths are tried, so it works whether the app starts from the repo root (IDE) or from
# this module's folder (./mvnw spring-boot:run). Real environment variables still take priority.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------------------
# Mail (Mailtrap sandbox SMTP for testing).
# Credentials come ONLY from the git-ignored .env file or environment variables, never from
# this file. The old Mailtrap username/password were committed here once and had to be rotated.
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
app.mail.from=${MAIL_FROM:springshop@email.com}

# ---------------------------------------------------------------------------
# Kafka consumer
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.order-placed=order-placed
# Consumers in one group share a topic's partitions; each event is handled by one instance.
spring.kafka.consumer.group-id=notification-service
# A brand-new group starts from the oldest message instead of only new ones, so events
# published before this service's first start are not skipped.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the real (Avro) deserializer so a corrupt message becomes an
# error the handler can dead-letter, instead of an exception inside poll() that can block the partition.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
# Deserialize into the generated OrderPlacedEvent class instead of a GenericRecord
spring.kafka.consumer.properties.specific.avro.reader=true
# Shared by the consumer and by the producer that writes to the dead-letter topic
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8085}

# Producer, used only to publish failed messages to order-placed-dlt
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# Retries before a message goes to the dead-letter topic (config/KafkaConsumerConfig.java)
app.kafka.retry.interval=2s
app.kafka.retry.max-retries=3

# Continue the producer's trace (read from the record headers) when handling a message
spring.kafka.listener.observation-enabled=true

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=notification-service
management.tracing.sampling.probability=1.0
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
