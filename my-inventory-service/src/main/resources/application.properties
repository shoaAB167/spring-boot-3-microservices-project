# No spaces in service names: this value becomes a Loki label, a trace service name and a
# metrics tag ("Inventory Service" used to break those).
spring.application.name=inventory-service
server.port=8082

# Local secrets and overrides: KEY=VALUE lines from a git-ignored .env file (see .env.example).
# Both paths are tried, so it works whether the app starts from the repo root (IDE) or from
# this module's folder (./mvnw spring-boot:run). Real environment variables still take priority.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------------------
# Database. Dev defaults; override via env vars.
# ---------------------------------------------------------------------------
spring.datasource.url=${INVENTORY_DB_URL:jdbc:mysql://localhost:3308/inventory_service}
spring.datasource.username=${INVENTORY_DB_USERNAME:root}
spring.datasource.password=${INVENTORY_DB_PASSWORD:mysql}

# Flyway owns the schema (db/migration/V1__..., V2__...); Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors as RFC 9457 Problem Details (application/problem+json)
spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=inventory-service
management.tracing.sampling.probability=1.0
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
