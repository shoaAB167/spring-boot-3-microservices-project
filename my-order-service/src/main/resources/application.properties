spring.application.name=order-service
server.port=8081

# Local secrets and overrides: KEY=VALUE lines from a git-ignored .env file (see .env.example).
# Both paths are tried, so it works whether the app starts from the repo root (IDE) or from
# this module's folder (./mvnw spring-boot:run). Real environment variables still take priority.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------------------
# Database (MySQL in Docker, see docker-compose.yml). Dev defaults; override via env vars.
# The services run on the host, so the DB is reached via localhost (host.docker.internal
# only resolves on Docker Desktop).
# ---------------------------------------------------------------------------
spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://localhost:3307/order_service}
spring.datasource.username=${ORDER_DB_USERNAME:root}
spring.datasource.password=${ORDER_DB_PASSWORD:mysql}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the
# entities match it. "ddl-auto=update" let Hibernate change the schema silently, with no
# history and no review, which is unsafe outside a toy project.
spring.flyway.enabled=true
# The existing local DB was created by Hibernate before Flyway was enabled. Baseline marks it
# as already being at V1 instead of failing with "non-empty schema without history table".
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a DB session open for the whole HTTP request (the Open Session In View anti-pattern).
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# inventory-service client (config/RestClientConfig.java)
# ---------------------------------------------------------------------------
inventory.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
inventory.client.connect-timeout=1s
inventory.client.read-timeout=1s

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ---------------------------------------------------------------------------
# Resilience4j for the "inventory" client (client/InventoryClient.java)
# Timeout budget: 3 attempts x 1s read timeout + 2 x 300ms wait = ~3.6s worst case.
# That is less than the gateway's 5s limit, so the gateway never gives up on a request
# that is still being processed here.
# ---------------------------------------------------------------------------
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.inventory.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventory.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.inventory.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventory.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventory.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.inventory.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventory.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=5

resilience4j.retry.instances.inventory.max-attempts=3
resilience4j.retry.instances.inventory.wait-duration=300ms
# Only retry errors that a second attempt might fix: network problems and 5xx responses.
resilience4j.retry.instances.inventory.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
# When the breaker is OPEN, fail fast; retrying a call we know will be rejected only adds delay.
resilience4j.retry.instances.inventory.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException
# (The old resilience4j.timelimiter.* setting was removed: @TimeLimiter only works on async
# methods returning CompletableFuture and was never applied. The HTTP read timeout does that job.)

# ---------------------------------------------------------------------------
# Kafka producer: Avro values, schema stored in Confluent Schema Registry
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.order-placed=order-placed
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8085}
# If Kafka is unreachable, send() waits up to max.block.ms (default 60s!) for metadata,
# which would block the HTTP request thread. Fail after 3s instead.
spring.kafka.producer.properties.max.block.ms=3000
# Kafka 3.x clients already default to acks=all + idempotence; stated here so it's visible.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Adds the trace id to each Kafka record header, so the notification-service trace
# continues the order-service trace in Tempo.
spring.kafka.template.observation-enabled=true

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=order-service
management.tracing.sampling.probability=1.0
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
