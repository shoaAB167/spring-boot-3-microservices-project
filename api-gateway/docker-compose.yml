# Infrastructure owned by the gateway: Keycloak (identity provider) and the Grafana
# observability stack (Loki = logs, Prometheus = metrics, Tempo = traces, Grafana = UI).
#
# All passwords below are LOCAL DEV defaults. Override them with environment variables
# or a .env file (git-ignored); never reuse these values anywhere real.
services:
  keycloak-mysql:
    container_name: keycloak-mysql
    image: mysql:8.4
    volumes:
      - ./volume-data/mysql_keycloak_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD:-rootc}
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0.1
    # --import-realm loads every JSON file in /opt/keycloak/data/import on start-up
    # (realms that already exist are skipped).
    command: [ "start-dev", "--import-realm" ]
    environment:
      # Keycloak 17+ (Quarkus based) reads KC_* variables. The old DB_VENDOR/DB_ADDR names
      # were silently ignored, so Keycloak used its embedded H2 file and every realm was lost
      # when the container was recreated.
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-mysql:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8181:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
    depends_on:
      keycloak-mysql:
        condition: service_healthy

  loki:
    container_name: loki
    image: grafana/loki:2.9.2
    command: [ '-config.file=/etc/loki/local-config.yaml' ]
    ports:
      - '3100:3100'

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.46.0
    command:
      - --enable-feature=exemplar-storage
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # The services run on the host (not in Docker), so Prometheus reaches them through
    # host.docker.internal. Docker Desktop defines that name; this line makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '9090:9090'

  tempo:
    container_name: tempo
    image: grafana/tempo:2.2.2
    command: [ '-config.file=/etc/tempo.yaml' ]
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - ./docker/tempo/tempo-data:/tmp/tempo   # git-ignored runtime data
    ports:
      - '3200:3200' # Tempo HTTP API (queried by Grafana)
      - '9411:9411' # Zipkin receiver (the services send spans here)

  grafana:
    container_name: grafana
    image: grafana/grafana:10.1.0
    volumes:
      - ./docker/grafana:/etc/grafana/provisioning/datasources:ro
    environment:
      # Anonymous admin with no login form: convenient locally, never do this on a shared server.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - '3000:3000'
