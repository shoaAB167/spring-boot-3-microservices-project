apiVersion: 1

# Grafana data sources, provisioned automatically at start-up.
# The links between them are what make observability useful:
#   Prometheus exemplar --> Tempo trace   (exemplarTraceIdDestinations)
#   Tempo trace         --> Loki logs     (tracesToLogs)
#   Loki log line       --> Tempo trace   (derivedFields, regex on the trace id)
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
  - name: Tempo
    type: tempo
    access: proxy
    orgId: 1
    url: http://tempo:3200
    basicAuth: false
    isDefault: true
    version: 1
    editable: false
    apiVersion: 1
    uid: tempo
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: 'loki'
      nodeGraph:
        enabled: true
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    version: 1
    editable: false
    apiVersion: 1
    jsonData:
      derivedFields:
        # Log lines contain "[app-name,traceId,spanId]" (logging.pattern.correlation in each
        # service). The old regex "\[.+,(.+?)," was greedy, so a message containing commas
        # captured the wrong text. This one only captures a 16/32 hex-character trace id.
        - datasourceUid: tempo
          matcherRegex: \[[^\],\s]+,([0-9a-f]{16,32}),[0-9a-f]+\]
          name: TraceID
          url: $${__value.raw}
