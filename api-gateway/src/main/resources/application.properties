spring.application.name=api-gateway
server.port=9000

# Local secrets and overrides: KEY=VALUE lines from a git-ignored .env file (see .env.example).
# Both paths are tried, so it works whether the app starts from the repo root (IDE) or from
# this module's folder (./mvnw spring-boot:run). Real environment variables still take priority.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------------------
# Downstream services (used by routes/Routes.java).
# Override with environment variables in other environments, e.g. ORDER_SERVICE_URL.
# ---------------------------------------------------------------------------
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8080}
order.service.url=${ORDER_SERVICE_URL:http://localhost:8081}
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}

# Browser origins allowed by CORS (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------------------------------------------------------------------------
# Security: validate JWTs issued by this Keycloak realm.
# Spring reads <issuer-uri>/.well-known/openid-configuration to find the signing keys.
# ---------------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/spring-microservices-shoaib}

# ---------------------------------------------------------------------------
# Swagger UI aggregated across services (dropdown at /swagger-ui.html)
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/aggregate/inventory-service/v3/api-docs

# ---------------------------------------------------------------------------
# Actuator
# /actuator/health is public, but details (circuit breaker states etc.) are shown
# only to callers with a valid token. "always" leaked internals to anyone.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------------
# Resilience4j defaults, applied to every gateway route's circuit breaker
# ---------------------------------------------------------------------------
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5

# Timeout budget: the gateway must wait LONGER than the slowest legitimate downstream call.
# order-service may spend up to ~3.6s calling inventory (3 attempts x 1s timeout + 2 x 300ms
# waits), so 3s here meant the gateway gave up and returned 503 while the order was still
# being created. See docs/concepts/03-resilience.md.
resilience4j.timelimiter.configs.default.timeout-duration=5s

# ---------------------------------------------------------------------------
# Observability (metrics -> Prometheus, traces -> Tempo via Zipkin protocol, logs -> Loki)
# ---------------------------------------------------------------------------
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=api-gateway
# 1.0 = trace every request. Fine for dev; use something like 0.1 in production.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
# Puts [app,traceId,spanId] in every log line so Grafana can jump from a log to its trace
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
